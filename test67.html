<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Study2Learn — OpenRouter</title>
<style>
  :root{--bg:#0f1724;--card:#0b1220;--accent:#3a86ff;--muted:#9aa4b2}
  body{font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:#e6eef8;margin:0;padding:24px}
  .wrap{max-width:900px;margin:24px auto;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border:1px solid rgba(255,255,255,0.03);padding:20px;border-radius:12px}
  h1{margin:0 0 12px;font-size:22px}
  input{width:100%;padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:inherit;font-size:16px}
  button{margin-top:12px;padding:12px 16px;border-radius:8px;border:none;background:var(--accent);color:white;font-weight:600;cursor:pointer}
  .section{margin-top:18px;background:var(--card);padding:14px;border-radius:10px;border:1px solid rgba(255,255,255,0.02)}
  .loading{opacity:.9;font-style:italic;color:var(--muted)}
  pre{white-space:pre-wrap;font-family:inherit}
  .meta{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Study2Learn Assistant</h1>
  <p class="meta">Enter any topic and get AI-generated notes, study tips and a short quiz. Powered by OpenRouter.</p>

  <input id="topicInput" placeholder="e.g. photosynthesis, pythagorean theorem, world war 2" />
  <button id="goBtn">Generate Study Material</button>

  <div id="output" class="section" style="display:none"></div>
  <div id="error" class="section" style="display:none;color:#ffb4b4"></div>
</div>

<script>
(async()=>{
  const btn = document.getElementById('goBtn');
  const input = document.getElementById('topicInput');
  const output = document.getElementById('output');
  const errorBox = document.getElementById('error');

  // ---------- CONFIG (integrated) ----------
  const OPENROUTER_KEY = "REPLACE_ME_WITH_sk-or-v1-2001b7f3dc542fc8ae632bd85a5f4418e4c4f5053d119d42e063a343ba1badc9"; // integrated by assistant in canvas
  const MODEL = "meta-llama/llama-3-8b-instruct"; // change if you want a different model
  const ENDPOINT = "https://openrouter.ai/api/v1/chat/completions";
  // ------------------------------------------

  function showError(msg){ errorBox.style.display='block'; errorBox.textContent = msg; }
  function clearError(){ errorBox.style.display='none'; errorBox.textContent=''; }

  async function generate(topic){
    clearError();
    output.style.display='block';
    output.innerHTML = `<div class="loading">Generating study material for <b>${escapeHtml(topic)}</b>…</div>`;

    try{
      const body = {
        model: MODEL,
        messages: [
          { role: 'user', content: `Create structured study notes, a concise summary, key points, topic-specific study tips, and 5 short quiz questions for the topic: ${topic}. Return the answer as HTML sections with headings.` }
        ],
        max_tokens: 800,
        temperature: 0.2
      };

      const res = await fetch(ENDPOINT, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
                  "Authorization": "Bearer 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",
        },
        body: JSON.stringify(body)
      });

      if (!res.ok){
        const text = await res.text();
        throw new Error(`OpenRouter error ${res.status}: ${text}`);
      }

      const data = await res.json();
      // OpenRouter returns choices[0].message.content (like OpenAI chat completions)
      const content = data?.choices?.[0]?.message?.content || data?.choices?.[0]?.text || JSON.stringify(data);

      output.innerHTML = `<div>${content}</div>`;
    }catch(err){
      output.style.display='none';
      showError(err.message || String(err));
      console.error(err);
    }
  }

  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;" })[c]); }

  btn.addEventListener('click', ()=>{
    const topic = input.value.trim();
    if (!topic) return showError('Please type a topic.');
    generate(topic);
  });

  // allow Enter key
  input.addEventListener('keydown',(e)=>{ if(e.key==='Enter') btn.click(); });

})();
</script>
</body>
</html>
